# The TRS-80 Model 4 in its own mode, with TRSDOS 6 or LS-DOS 6, for the llvm16 target: built with llvm-z80 and linked by
# the zcc of z88dk. z88dk has no Model 4 target, so this links for +trs80 without its Model I/III DOS library (subtype disk)
# at $3000, and z80-trs80-m4.asm has the stack, console, keyboard and exit status through the DOS's supervisor calls, and
# z80-trs80-m4-wait.c the usleep of sys.wait. A .cmd program that runs from the DOS prompt, on an 80x24 screen.
base = z80-z88dk
# the crt0 defines EG2000_ENABLED and CLIB_KEYBOARD_ADDRESS only without a CRT_ORG_CODE of its own
link_command = zcc +trs80 -subtype=disk -create-app -lndos -pragma-define:CRT_ORG_CODE=0x3000 -pragma-define:EG2000_ENABLED=0 -pragma-define:CLIB_KEYBOARD_ADDRESS=0x3800 -pragma-define:CRT_HEAP_AMALLOC=1 -pragma-redirect:fputc_cons=_prog8_trs80m4_fputc -pragma-redirect:getk=_prog8_trs80m4_getk -pragma-redirect:fgetc_cons=_prog8_trs80m4_fgetc_cons {floats} -o {stem}.bin {startup} {object} -l${LLVM_Z80}/lib/z80/z80_rt_z88dk
startup_source = z80-trs80-m4.asm z80-trs80-m4-wait.c
# z88dk's file routines are stubs that fail (-lndos): the file source has them through the DOS's supervisor calls,
# linked when the program opens, renames or removes files
file_source = z80-trs80-m4-files.c
# z88dk's fread never sets the end of the file, and its qsort calls the comparison with the arguments swapped
c_symbols = fread=prog8_trs80m4_fread qsort=prog8_trs80m4_qsort tanf=tan atanf=atan atan2f=atan2 powf=pow floorf=floor ceilf=ceil roundevenf=prog8_z80_roundeven strtod=prog8_z80_strtod
# readdir's entries of the file source have the name first
dirent_name_offset = 0
output_extension = .cmd
# console output goes through fputc_cons, the screen routines through the support source (prog8lib/llvm16/trs80m4/textio.p8)
library = trs80m4
putchar_symbol = fputc_cons
# a DOS file spec is NAME/EXT.PASSWORD:DRIVE
file_extension_separator = /
# every constant address is volatile, as on Prog8's 6502 targets
io_ranges = *
# the C functions that don't link or don't work: the subdirectories (the DOS has none)
libc_lacks = getcwd mkdir chdir rmdir roundeven
