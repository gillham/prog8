# What every Z80 profile that links with z88dk shares, for the llvm16 target: built with llvm-z80 (LLVM_Z80 names its directory)
# and linked by the zcc of z88dk (Z88DK names the z88dk directory). Only a base for other profiles, which add the link_command.
abstract = true
triple = z80-unknown-none-z88dk
datalayout = e-m:o-p:16:8-i16:8-i32:8-i64:8-i128:8-f16:8-f32:8-f64:8-f128:8-ve-a:8-n8:16
c_int_size = 2
c_long_size = 4
clang = ${LLVM_Z80}/bin/clang
clang_args = --target=z80-unknown-none-z88dk
# clang runs z88dk-z80asm from the PATH, and zcc needs ZCCCFG
tool_path = ${Z88DK}/bin
tool_env = ZCCCFG=${Z88DK}/lib/config
# getchar is a macro in z88dk; fgetc_cons reads the console
getchar_symbol = fgetc_cons
