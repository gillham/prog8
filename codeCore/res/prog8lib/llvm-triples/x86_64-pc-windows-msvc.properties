# 64-bit Windows with clang and the Microsoft C runtime. A C long has 4 bytes here.
triple = x86_64-pc-windows-msvc
datalayout = e-m:w-p270:32:32-p271:32:32-p272:64:64-i64:64-i128:128-f80:128-n8:16:32:64-S128
c_long_size = 4
output_extension = .exe
# file positions with 64 bits, as on the other 64-bit platforms
fseek_symbol = _fseeki64
ftell_symbol = _ftelli64
file_offset_size = 8
# the startup code's readdir() gives entries that are just the name
dirent_name_offset = 0
clang_args = --target=x86_64-pc-windows-msvc
# the startup code gives the program the byte streams, and the usleep, roundeven and directory routines of the other platforms
link_command = clang --target=x86_64-pc-windows-msvc -O2 {startup} {object} -o {file}
startup_source = windows-console.c
