# 32-bit ARM bare metal (Cortex-A15, hardware floating point), linked with newlib of the Arm GNU Toolchain
# and run on qemu's Versatile Express machine, which reaches the host through semihosting.
# ARM_GNU_TOOLCHAIN names the toolchain directory; without it, the default install location on macOS is used.
triple = armv7-unknown-none-eabihf
datalayout = e-m:e-p:32:32-Fi8-i64:64-v128:64:128-a:0:32-n32-S64
c_long_size = 4
clang_args = --target=armv7a-none-eabihf -mcpu=cortex-a15 -mfloat-abi=hard
# the toolchain's own startup objects have no .note.GNU-stack section, which would make every link warn;
# newlib has no roundeven, which LLVM calls on ARMv7, but rint rounds the same in the default rounding mode
link_command = ${ARM_GNU_TOOLCHAIN:-/Applications/ArmGNUToolchain/15.3.rel2/arm-none-eabi}/bin/arm-none-eabi-gcc -mcpu=cortex-a15 -mfloat-abi=hard -mfpu=neon-vfpv4 --specs=aprofile-ve.specs -Wl,--no-warn-execstack -Wl,--wrap=_read {startup} {object} -Wl,-u,rint -lm -Wl,--defsym=roundeven=rint -o {file}
# reads the console input, which newlib can't get from qemu
startup_source = qemu-semihosting-console.c
output_extension = .elf
run_command = qemu-system-arm -M vexpress-a15 -cpu cortex-a15 -display none -monitor none -serial none -chardev stdio,id=console -semihosting-config enable=on,target=native,chardev=console{semihosting_args} -kernel {file}
# qemu keeps running when the program crashes instead of exiting
run_timeout_seconds = 60
