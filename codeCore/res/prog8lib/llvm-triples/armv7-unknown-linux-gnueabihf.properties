# 32-bit ARM Linux with hardware floating point. Cross compiling needs a sysroot, for example:
# clang_args = --target=armv7-unknown-linux-gnueabihf --sysroot=${ARM_SYSROOT}
triple = armv7-unknown-linux-gnueabihf
datalayout = e-m:e-p:32:32-Fi8-i64:64-v128:64:128-a:0:32-n32-S64
c_long_size = 4
# where readdir64()'s struct dirent64 has its d_name; plain readdir() fails on inode numbers above 32 bits
dirent_name_offset = 19
readdir_symbol = readdir64
clang_args = --target=armv7-unknown-linux-gnueabihf
# glibc has the math functions in a library of their own, which clang only links in when asked
link_args = -lm
