# WebAssembly with Emscripten, linked by emcc into a single .js file that runs with node.
# EMCC names the emcc command; without it, the one on the PATH is used.
# NODERAWFS gives the program the host's file system, relative to the current directory, instead of an in-memory one.
triple = wasm32-unknown-emscripten
datalayout = e-m:e-p:32:32-p10:8:8-p20:8:8-i64:64-i128:128-f128:64-n32:64-S128-ni:1:10:20
c_long_size = 4
# where readdir()'s struct dirent has its d_name
dirent_name_offset = 19
clang_args = --target=wasm32-unknown-emscripten
# wasm-ld only warns about a function signature mismatch, and the call then traps at runtime
link_command = ${EMCC:-emcc} {object} -sNODERAWFS=1 -sEXIT_RUNTIME=1 -sSINGLE_FILE=1 -sALLOW_MEMORY_GROWTH=1 -Wl,--fatal-warnings -o {file}
output_extension = .js
run_command = node {file}
strict_indirect_signatures = true
# Emscripten's startup code calls the C main by this name
c_main_symbol = __main_argc_argv
