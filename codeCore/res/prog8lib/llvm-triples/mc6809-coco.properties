# The Color Computer 2 and 3 with Extended or Disk Extended Color BASIC, for the llvm16 target: built with llvm-mc6809 and
# its picolibc (LLVM_MC6809 names the llvm-mc6809 directory) into a .bin DECB machine language program, which loads at $3F00,
# or at the page that %address or -address gives. Move BASIC below it first with CLEAR 200,&H3EFF (one below the load address),
# then LOADM"NAME" and EXEC; without the CLEAR the program gets no heap.
# The console goes through the BASIC ROM, and the program returns to BASIC when it ends, without an exit status or arguments.
# The program, its data and its heap share the load address to the top of RAM ($7FFF in BASIC on a 32 KB or larger machine).
triple = mc6809-unknown-decb
datalayout = E-p:16:8-p1:8:8-S8-m:e-i1:8-i8:8-i16:8-i32:8-i64:8-f32:8-f64:8-a:0-n8:16
c_int_size = 2
c_long_size = 4
clang = ${LLVM_MC6809}/bin/clang
clang_args = --target=mc6809-unknown-decb
# the driver's -T replaces its own mc6809-decb.lds, whose load address is fixed
link_command = ${LLVM_MC6809}/bin/clang --target=mc6809-unknown-decb -T {link_script} {startup} {object} -o {file}
link_script = mc6809-coco.lds
load_address = $3F00
load_address_align = 256
# the console output routine, unbuffered, for putchar_symbol, and the key poll of the coco textio
startup_source = mc6809-coco-console.c
putchar_symbol = prog8_coco_putchar
# the textio for the 32x16 VDG text screen
library = coco
output_extension = .bin
program_args = false
# every constant address is volatile, as on Prog8's 6502 targets: besides the I/O chips at $FF00-$FFFF, interrupts change
# system variables in RAM (such as BASIC's timer), which a loop must read again each time
io_ranges = *
# the C functions that a program can't link: DECB has no file system calls (open, unlink) and no float library
# inp and outp: the 6502 and 6809 have no I/O ports (sys.inp gives 0, sys.outp does nothing)
libc_lacks = fopen remove rename getcwd mkdir chdir rmdir opendir readdir closedir strtod \
    sin sinf cos cosf tan tanf atan atanf atan2 atan2f sqrt sqrtf pow powf log logf log2 log2f fabs fabsf floor floorf ceil ceilf roundeven roundevenf inp outp
