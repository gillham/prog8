# 32-bit RISC-V bare metal (RV32IMAFDC, hardware floating point), linked with newlib of the xPack GNU RISC-V Embedded GCC
# and run on qemu's virt machine, which reaches the host through semihosting.
# RISCV_NONE_ELF_GCC names its riscv-none-elf-gcc; without it, the one on the PATH is used.
triple = riscv32-unknown-unknown-elf
datalayout = e-m:e-p:32:32-i64:64-n32-S128
c_long_size = 4
clang_args = --target=riscv32-unknown-elf -march=rv32imafdc -mabi=ilp32d
# newlib has no roundeven, which LLVM calls, but rint rounds the same in the default rounding mode
link_command = ${RISCV_NONE_ELF_GCC:-riscv-none-elf-gcc} -march=rv32imafdc_zicsr -mabi=ilp32d --specs=semihost.specs -Wl,-Ttext-segment=0x80000000 -Wl,-e,_boot {startup} {object} -Wl,-u,rint -lm -Wl,--defsym=roundeven=rint -o {file}
# sets up the stack and the floating point unit, and passes the exit status to qemu
startup_source = riscv32-qemu-virt-boot.S
output_extension = .elf
run_command = qemu-system-riscv32 -M virt -nographic -semihosting-config enable=on,target=native{semihosting_args} -bios {file}
# qemu keeps running when the program crashes instead of exiting
run_timeout_seconds = 60
