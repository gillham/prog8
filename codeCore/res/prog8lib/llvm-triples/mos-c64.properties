# The Commodore 64 with the llvm-mos SDK, for the llvm16 target: builds a .prg program file. LLVM_MOS names the llvm-mos SDK directory.
# The run command starts the VICE emulator x64sc, which opens a window and keeps running until it is closed.
triple = mos
datalayout = e-m:e-p:16:8-p1:8:8-i16:8-i32:8-i64:8-f32:8-f64:8-a:8-Fi8-n8
c_int_size = 2
c_long_size = 4
clang = ${LLVM_MOS}/bin/mos-c64-clang
# the link command builds the support source along, with the usleep that sys.wait needs
link_command = ${LLVM_MOS}/bin/mos-c64-clang -Os {startup} {object} -o {file}
startup_source = mos-c64-support.c
# sys.waitvsync waits for the raster to wrap around to line 0, with the routine in that support source
waitvsync_symbol = prog8_c64_waitvsync
output_extension = .prg
# the llvm16 stream textio, with txt.getkey() and txt.waitkey() through the KERNAL's GETIN (prog8lib/llvm16/c64/textio.p8)
library = c64
run_command = x64sc -autostart {file}
program_args = false
# every constant address is volatile, as on Prog8's 6502 targets: besides the I/O chips, interrupts change system
# variables in RAM (such as a clock or the cursor blink), which a loop must read again each time
io_ranges = *
# the C functions that a program can't link, as they are missing from the SDK libraries
libc_lacks = getcwd mkdir chdir rmdir opendir readdir closedir strdup strtod \
    sin sinf cos cosf tan tanf atan atanf atan2 atan2f sqrt sqrtf pow powf log logf log2 log2f fabs fabsf floor floorf ceil ceilf roundeven roundevenf
