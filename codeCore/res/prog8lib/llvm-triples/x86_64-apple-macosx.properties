# Intel macOS. On Apple Silicon the program runs under Rosetta 2.
triple = x86_64-apple-macosx
datalayout = e-m:o-p270:32:32-p271:32:32-p272:64:64-i64:64-i128:128-f80:128-n8:16:32:64-S128
c_long_size = 8
# where readdir()'s struct dirent has its d_name; the SDK's 64-bit inode versions of the directory routines have these names
dirent_name_offset = 21
opendir_symbol = opendir$INODE64
readdir_symbol = readdir$INODE64
clang_args = --target=x86_64-apple-macosx
