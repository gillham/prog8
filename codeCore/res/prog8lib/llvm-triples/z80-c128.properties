# The Commodore 128 in Z80 mode, for the llvm16 target: built with llvm-z80 and linked by the zcc of z88dk for its +c128
# platform, subtype disk. Builds a program file without an extension that loads at $5000: LOAD"NAME",8,1 and then
# BANK 0:SYS 20480 starts it, which switches to the Z80; zcc also writes a .ldr BASIC loader that expects the file under
# the name it was linked as. There are no files and no command line. The VIC, SID and CIAs are I/O ports on the Z80, so a
# poke can't reach them.
base = z80-z88dk
# z80_rt_z88dk is llvm-z80's compiler support library built for z88dk; zcc writes the program as {stem}
# ansicolumns=40: without it z88dk's console is 64 columns wide (screensize, gotoxy), while its ANSI console draws 40
link_command = zcc +c128 -subtype=disk -create-app -pragma-define:ansicolumns=40 {floats} -o {stem}.bin {startup} {object} -l${LLVM_Z80}/lib/z80/z80_rt_z88dk
output_extension =
# console output and the txt module use z88dk's ANSI console (prog8lib/llvm16/z88dk-ansi/textio.p8)
library = z88dk-ansi
putchar_symbol = fputc_cons
program_args = false
# every constant address is volatile, as on Prog8's 6502 targets: besides the I/O chips, interrupts change system
# variables in RAM (such as a clock or the cursor blink), which a loop must read again each time
io_ranges = *
# the C functions that z88dk's +c128 library doesn't link; its qsort calls the comparison function with the arguments swapped
libc_lacks = qsort getcwd mkdir chdir rmdir opendir readdir closedir strdup realloc free usleep roundeven
