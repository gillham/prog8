# The 6502 simulator of llvm-mos (mos-sim), for the llvm16 target. LLVM_MOS names the llvm-mos SDK directory.
# mos-sim prints the program's output on the console and exits with its exit status; it can't pass command line arguments.
triple = mos
datalayout = e-m:e-p:16:8-p1:8:8-i16:8-i32:8-i64:8-f32:8-f64:8-a:8-Fi8-n8
c_int_size = 2
c_long_size = 4
clang = ${LLVM_MOS}/bin/mos-sim-clang
output_extension = .sim
run_command = ${LLVM_MOS}/bin/mos-sim {file}
program_args = false
# the simulator's I/O registers
io_ranges = $fff0-$ffff
# the C functions that a program can't link: missing from the SDK libraries, or needing file system calls the simulator lacks
# inp and outp: the 6502 and 6809 have no I/O ports (sys.inp gives 0, sys.outp does nothing)
libc_lacks = fopen fclose fflush remove rename getcwd mkdir chdir rmdir opendir readdir closedir strdup usleep strtod \
    sin sinf cos cosf tan tanf atan atanf atan2 atan2f sqrt sqrtf pow powf log logf log2 log2f fabs fabsf floor floorf ceil ceilf roundeven roundevenf inp outp
