# The TRS-80 Model I and III with TRSDOS or LDOS, for the llvm16 target: built with llvm-z80 and linked by the zcc of z88dk
# for its +trs80 platform, subtype cmd. Builds a .cmd program that runs from the DOS prompt, with file I/O through the DOS
# and the command line that the DOS passes. The malloc heap gets 3/4 of the free memory at startup.
base = z80-z88dk
# z80_rt_z88dk is llvm-z80's compiler support library built for z88dk
link_command = zcc +trs80 -subtype=cmd -create-app -pragma-define:CRT_HEAP_AMALLOC=1 -o {stem}.bin {startup} {object} -l${LLVM_Z80}/lib/z80/z80_rt_z88dk
output_extension = .cmd
# the memory-mapped devices of the Model I (printer at $37e8, disk controller), the keyboard matrix and the video RAM
io_ranges = $37e0-$37ff,$3800-$3bff,$3c00-$3fff
# the C functions that z88dk's +trs80 cmd library doesn't link; its qsort calls the comparison function with the arguments swapped
libc_lacks = qsort ftell rename getcwd mkdir chdir rmdir opendir readdir closedir usleep strtod \
    sin sinf cos cosf tan tanf atan atanf atan2 atan2f sqrt sqrtf pow powf log logf log2 log2f fabs fabsf floor floorf ceil ceilf roundeven roundevenf
