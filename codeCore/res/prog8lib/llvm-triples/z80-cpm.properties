# CP/M 2.2 and later on the Z80, for the llvm16 target: built with llvm-z80 and linked by the zcc of z88dk for its +cpm
# platform. Builds a .com program, with file I/O through the BDOS; the CCP upper-cases the command line before the program
# gets it. tnylpo or RunCPM run it on the host.
base = z80-z88dk
# z80_rt_z88dk is llvm-z80's compiler support library built for z88dk; -create-app would name the file in upper case
link_command = zcc +cpm -o {file} {startup} {object} -l${LLVM_Z80}/lib/z80/z80_rt_z88dk
output_extension = .com
# the C functions that z88dk's +cpm library doesn't link; its qsort calls the comparison function with the arguments swapped
libc_lacks = qsort getcwd mkdir chdir rmdir opendir readdir closedir strdup realloc free usleep strtod \
    sin sinf cos cosf tan tanf atan atanf atan2 atan2f sqrt sqrtf pow powf log logf log2 log2f fabs fabsf floor floorf ceil ceilf roundeven roundevenf
