# 64-bit ARM Linux with glibc. Cross compiling needs a sysroot, for example with -Xcompile --sysroot=<dir>.
triple = aarch64-unknown-linux-gnu
datalayout = e-m:e-p270:32:32-p271:32:32-p272:64:64-i8:8:32-i16:16:32-i64:64-i128:128-n32:64-S128-Fn32
c_long_size = 8
clang_args = --target=aarch64-unknown-linux-gnu
