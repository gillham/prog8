# Apple Silicon macOS, the default triple of the llvm64 target.
triple = arm64-apple-macosx
datalayout = e-m:o-p270:32:32-p271:32:32-p272:64:64-i64:64-i128:128-n32:64-S128-Fn32
c_long_size = 8
# where readdir()'s struct dirent has its d_name
dirent_name_offset = 21
clang_args = --target=arm64-apple-macosx
