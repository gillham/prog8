# WebAssembly with the WASI preview 1 system interface, run with a WASI runtime such as wasmtime.
# WASI_SYSROOT names the wasi-libc sysroot; without it, the one of Homebrew's wasi-libc is used.
# Linking needs wasm-ld (from lld). The run command gives the program access to the current directory.
triple = wasm32-unknown-wasip1
datalayout = e-m:e-p:32:32-p10:8:8-p20:8:8-i64:64-i128:128-n32:64-S128-ni:1:10:20
c_long_size = 4
# wasm-ld only warns about a function signature mismatch, and the call then traps at runtime
clang_args = --target=wasm32-wasip1 --sysroot=${WASI_SYSROOT:-/opt/homebrew/opt/wasi-libc/share/wasi-sysroot} -Wl,--fatal-warnings
output_extension = .wasm
run_command = wasmtime --dir=. {file}
strict_indirect_signatures = true
# wasi-libc's startup code calls the C main by this name
c_main_symbol = __main_argc_argv
