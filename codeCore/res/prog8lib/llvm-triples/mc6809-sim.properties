# The 6809 bare metal, for the llvm16 target: built with llvm-mc6809 and its picolibc (LLVM_MC6809 names the llvm-mc6809
# directory) and run in usim09batch, which prints the program's output on the console and exits with its exit status;
# it can't pass command line arguments. The 6809 is big-endian.
triple = mc6809
datalayout = E-p:16:8-p1:8:8-S8-m:e-i1:8-i8:8-i16:8-i32:8-i64:8-f32:8-f64:8-a:0-n8:16
c_int_size = 2
c_long_size = 4
clang = ${LLVM_MC6809}/bin/mc6809-clang
# the semihost startup code talks to usim09batch's console and halt devices
link_command = ${LLVM_MC6809}/bin/mc6809-clang -mcrt0=semihost {startup} {object} -o {file}
# waits for the console to send the last byte before the program halts
startup_source = mc6809-semihost-drain.c
output_extension = .elf
# usim09batch's timeout counts instructions, and it exits with status 124 when it is reached
run_command = usim09batch --timeout=2000000000 {file}
program_args = false
# the simulator's devices
io_ranges = $ffc0-$ffcf
libc_lacks = rename getcwd mkdir chdir rmdir opendir readdir closedir usleep strtod \
    sin sinf cos cosf tan tanf atan atanf atan2 atan2f sqrt sqrtf pow powf log logf log2 log2f fabs fabsf floor floorf ceil ceilf roundeven roundevenf
