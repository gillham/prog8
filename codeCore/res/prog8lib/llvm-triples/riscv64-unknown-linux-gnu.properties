# 64-bit RISC-V Linux with glibc (RV64GC, hardware floating point). Cross compiling needs a sysroot, for example with -Xcompile --sysroot=<dir>.
triple = riscv64-unknown-linux-gnu
datalayout = e-m:e-p:64:64-i64:64-i128:128-n32:64-S128
c_long_size = 8
clang_args = --target=riscv64-unknown-linux-gnu
# glibc has the math functions in a library of their own, which clang only links in when asked
link_args = -lm
