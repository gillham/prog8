# The Z80, for the llvm16 target: built with llvm-z80 (LLVM_Z80 names its directory), linked by the zcc of z88dk for its
# +test platform (Z88DK names the z88dk directory), and run in z88dk-ticks, which prints the program's output on the console
# and exits with its exit status; it can't pass command line arguments.
triple = z80-unknown-none-z88dk
datalayout = e-m:o-p:16:8-i16:8-i32:8-i64:8-i128:8-f16:8-f32:8-f64:8-f128:8-ve-a:8-n8:16
c_int_size = 2
c_long_size = 4
clang = ${LLVM_Z80}/bin/clang
clang_args = --target=z80-unknown-none-z88dk
# clang runs z88dk-z80asm from the PATH, and zcc needs ZCCCFG
tool_path = ${Z88DK}/bin
tool_env = ZCCCFG=${Z88DK}/lib/config
# z80_rt_z88dk is llvm-z80's compiler support library (__muldi3, __z80_memset_builtin, ...) built for z88dk
link_command = zcc +test -o {file} {object} -l${LLVM_Z80}/lib/z80/z80_rt_z88dk
output_extension = .bin
# z88dk-ticks stops a program after 100 million cycles unless told otherwise
run_command = z88dk-ticks -counter 100000000000 {file}
program_args = false
# getchar is a macro in z88dk; fgetc_cons reads the console, which z88dk-ticks gives the standard input
getchar_symbol = fgetc_cons
# the C functions that z88dk's +test library doesn't have; its qsort calls the comparison function with the arguments swapped,
# z88dk-ticks can't remove or rename a file, and its ftell always gives -1
libc_lacks = remove rename ftell getcwd mkdir chdir rmdir opendir readdir closedir strdup realloc free usleep strtod qsort \
    sin sinf cos cosf tan tanf atan atanf atan2 atan2f sqrt sqrtf pow powf log logf log2 log2f fabs fabsf floor floorf ceil ceilf roundeven roundevenf
