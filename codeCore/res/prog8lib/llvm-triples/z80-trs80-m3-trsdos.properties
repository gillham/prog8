# The TRS-80 Model III with TRSDOS 1.3, for the llvm16 target: z80-trs80-cmd with the stack at HIGH$ ($4411). TRSDOS 1.3
# starts a program with its stack in the system area at $4089, which z88dk's startup code then overwrites, so it hangs.
# Works on the Model III with LDOS too, but not on the Model I, whose HIGH$ is at $4049: use z80-trs80-cmd there.
# PROG8_TRS80_TRSDOS13 makes ftell and fseek of a file being read follow TRSDOS 1.3's file control block, so they are
# wrong under LDOS.
base = z80-trs80-cmd
# no CRT_HEAP_ENABLE: the malloc heap then ends below the stack instead of at HIGH$
link_command = zcc +trs80 -subtype=cmd -create-app -DPROG8_TRS80_TRSDOS13 -pragma-define:REGISTER_SP=-0x4411 -pragma-define:CRT_HEAP_AMALLOC=1 -pragma-redirect:getk=_prog8_trs80_getk -pragma-redirect:fgetc_cons=_prog8_trs80_fgetc_cons {floats} -o {stem}.bin {startup} {object} -l${LLVM_Z80}/lib/z80/z80_rt_z88dk
