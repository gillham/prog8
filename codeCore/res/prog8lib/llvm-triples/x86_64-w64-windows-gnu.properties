# 64-bit Windows with llvm-mingw (clang with the mingw-w64 runtime). A C long has 4 bytes here.
triple = x86_64-w64-windows-gnu
datalayout = e-m:w-p270:32:32-p271:32:32-p272:64:64-i64:64-i128:128-f80:128-n8:16:32:64-S128
c_long_size = 4
output_extension = .exe
# file positions with 64 bits, as on the other 64-bit platforms
fseek_symbol = _fseeki64
ftell_symbol = _ftelli64
file_offset_size = 8
# where mingw-w64's readdir() has the d_name of its struct dirent
dirent_name_offset = 8
clang_args = --target=x86_64-w64-windows-gnu
# the startup code switches the console and files to binary mode, as on the other platforms, and adds roundeven
link_command = clang --target=x86_64-w64-windows-gnu -O2 {startup} {object} -o {file}
startup_source = mingw-console.c
