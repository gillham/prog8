# The ZX Spectrum, for the llvm16 target: built with llvm-z80 and linked by the zcc of z88dk for its +zx platform.
# Builds a .tap tape file that loads with LOAD "" and starts itself. There are no files and no command line, and the
# hardware is reached through I/O ports (the ULA is port $fe), so a poke can't reach it; the screen is plain RAM.
base = z80-z88dk
# z80_rt_z88dk is llvm-z80's compiler support library built for z88dk; zcc writes {stem}.tap
link_command = zcc +zx -create-app -o {stem}.bin {startup} {object} -l${LLVM_Z80}/lib/z80/z80_rt_z88dk
output_extension = .tap
# console output and the txt module use z88dk's generic console (prog8lib/llvm16/z88dk/textio.p8)
library = z88dk
putchar_symbol = fputc_cons
program_args = false
# the C functions that z88dk's +zx library doesn't link; its qsort calls the comparison function with the arguments swapped
libc_lacks = qsort getcwd mkdir chdir rmdir opendir readdir closedir strdup realloc free usleep strtod \
    sin sinf cos cosf tan tanf atan atanf atan2 atan2f sqrt sqrtf pow powf log logf log2 log2f fabs fabsf floor floorf ceil ceilf roundeven roundevenf
