# 64-bit x86 Linux with glibc. Cross compiling needs a sysroot, for example with -Xcompile --sysroot=<dir>.
triple = x86_64-unknown-linux-gnu
datalayout = e-m:e-p270:32:32-p271:32:32-p272:64:64-i64:64-i128:128-f80:128-n8:16:32:64-S128
c_long_size = 8
# where readdir()'s struct dirent has its d_name
dirent_name_offset = 19
clang_args = --target=x86_64-unknown-linux-gnu
# glibc has the math functions in a library of their own, which clang only links in when asked
link_args = -lm
