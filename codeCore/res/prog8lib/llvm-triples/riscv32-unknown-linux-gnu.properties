# 32-bit RISC-V Linux with glibc (RV32GC, hardware floating point). Cross compiling needs a sysroot, for example with -Xcompile --sysroot=<dir>;
# with that of a GCC toolchain that clang doesn't recognize, such as Buildroot's, also -Xcompile --gcc-install-dir=<its lib/gcc/<tuple>/<version>>.
triple = riscv32-unknown-linux-gnu
datalayout = e-m:e-p:32:32-i64:64-n32-S128
c_long_size = 4
# where readdir()'s struct dirent has its d_name; glibc on RV32 has 64-bit inode numbers from the start
dirent_name_offset = 19
clang_args = --target=riscv32-unknown-linux-gnu -march=rv32gc -mabi=ilp32d
# glibc has the math functions in a library of their own, which clang only links in when asked
link_args = -lm
