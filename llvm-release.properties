# The llvm branch's release counter, appended to the upstream version of gradle.properties: 14.0-BETA3 with
# llvmRelease=1 gives version 14.0-BETA3-llvm.1, and the release tag v14.0-BETA3-llvm.1.
# Kept out of gradle.properties so upstream version bumps merge cleanly. Raise it for each llvm release on the same
# upstream version, and set it back to 1 when the upstream version changes.
llvmRelease=1
