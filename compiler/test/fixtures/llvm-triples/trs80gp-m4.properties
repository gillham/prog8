# For the compiler's tests: z80-trs80-m4 programs run in trs80gp on a Model 4 with TRSDOS 6, trs80gp's default DOS there,
# whose boot disk has room for the files of the test programs (TRS80GP names the trs80gp binary). The support sources
# mirror the console output to the printer and pass the exit status to trs80gp.
base = z80-trs80-m4
startup_source = trs80gp-output.c trs80gp-exit.asm z80-trs80-m4.asm z80-trs80-command-line.asm z80-trs80-m4-wait.c
link_command = zcc +trs80 -subtype=disk -create-app -lndos -DPROG8_CONSOLE=prog8_trs80m4_fputc -pragma-define:CRT_ORG_CODE=0x3000 -pragma-define:EG2000_ENABLED=0 -pragma-define:CLIB_KEYBOARD_ADDRESS=0x3800 -pragma-define:CRT_HEAP_AMALLOC=1 -pragma-redirect:fputc_cons=_prog8_fputc -pragma-redirect:getk=_prog8_trs80m4_getk -pragma-redirect:fgetc_cons=_prog8_trs80m4_fgetc_cons {floats} -o {stem}.bin {startup} {object} -l${LLVM_Z80}/lib/z80/z80_rt_z88dk
# a .cmd loaded by trs80gp gets no command line
program_args = false
# drive 1 has a writable disk (another of trs80gp's own), for the test of diskio.last_drive()
run_command = ${PYTHON:-python3} {profile_dir}/run-trs80gp.py -m4 -d1 :lu4 -im wp 1 off {file}
run_timeout_seconds = 60
