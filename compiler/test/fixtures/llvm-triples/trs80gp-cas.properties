# For the compiler's tests: z80-trs80 programs, .cas files without a DOS, run in trs80gp from ROM BASIC on a Model III
# (TRS80GP names the trs80gp binary). The support sources mirror the console output to the printer and pass the exit
# status to trs80gp. The link command repeats z80-trs80's, which puts the stack at the top of memory (MEMSIZ).
base = z80-trs80
startup_source = trs80gp-output.c trs80gp-exit.asm z80-trs80-keyboard.asm
link_command = zcc +trs80 -create-app -pragma-define:REGISTER_SP=-0x40B1 -pragma-redirect:fputc_cons=_prog8_fputc -pragma-redirect:getk=_prog8_trs80_getk -pragma-redirect:fgetc_cons=_prog8_trs80_fgetc_cons -o {stem}.bin {startup} {object} -l${LLVM_Z80}/lib/z80/z80_rt_z88dk
run_command = ${PYTHON:-python3} {profile_dir}/run-trs80gp.py -m3 -dx {file}
run_timeout_seconds = 60
