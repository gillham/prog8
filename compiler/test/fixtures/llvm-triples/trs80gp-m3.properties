# For the compiler's tests: z80-trs80-cmd programs run in trs80gp on a Model III with LDOS (TRS80GP names the trs80gp
# binary). The support sources mirror the console output to the printer and pass the exit status to trs80gp.
base = z80-trs80-cmd
startup_source = trs80gp-output.c trs80gp-exit.asm z80-trs80-keyboard.asm
link_command = zcc +trs80 -subtype=cmd -create-app -pragma-define:CRT_HEAP_AMALLOC=1 -pragma-define:CRT_HEAP_ENABLE=1 -pragma-redirect:fputc_cons=_prog8_fputc -pragma-redirect:getk=_prog8_trs80_getk -pragma-redirect:fgetc_cons=_prog8_trs80_fgetc_cons {floats} -o {stem}.bin {startup} {object} -l${LLVM_Z80}/lib/z80/z80_rt_z88dk
# a .cmd loaded by trs80gp gets no command line
program_args = false
run_command = ${PYTHON:-python3} {profile_dir}/run-trs80gp.py -m3 -ld {file}
run_timeout_seconds = 60
