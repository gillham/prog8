# For the compiler's tests: z80-trs80-m3-trsdos programs run in trs80gp on a Model III with TRSDOS 1.3 (TRS80GP names the
# trs80gp binary). The support sources mirror the console output to the printer and pass the exit status to trs80gp.
base = z80-trs80-m3-trsdos
startup_source = trs80gp-output.c trs80gp-exit.asm z80-trs80-keyboard.asm z80-trs80-command-line.asm
link_command = zcc +trs80 -subtype=cmd -create-app -DPROG8_TRS80_TRSDOS13 -pragma-define:REGISTER_SP=-0x4411 -pragma-define:CRT_HEAP_AMALLOC=1 -DPROG8_GENERIC_CONSOLE=prog8_trs80_console -pragma-redirect:fputc_cons=_prog8_fputc -pragma-redirect:getk=_prog8_trs80_getk -pragma-redirect:fgetc_cons=_prog8_trs80_fgetc_cons {floats} -o {stem}.bin {startup} {object} -l${LLVM_Z80}/lib/z80/z80_rt_z88dk
# a .cmd loaded by trs80gp gets no command line
program_args = false
# drive 1 has a writable disk (another of trs80gp's own), for the test of diskio.last_drive()
run_command = ${PYTHON:-python3} {profile_dir}/run-trs80gp.py -m3 -d1 :td3 -im wp 1 off {file}
run_timeout_seconds = 60
