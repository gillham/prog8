# For the compiler's tests: z80-cpm programs run in tnylpo, with the current directory as drive A. The support source
# prints the exit status as a last line, which the runner script turns into its own exit status.
base = z80-cpm
startup_source = cpm-exit-marker.asm
run_command = ${PYTHON:-python3} {profile_dir}/run-tnylpo.py {file}
run_timeout_seconds = 60
